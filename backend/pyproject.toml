[project]
name = "deployiq-backend"
version = "0.1.0"
description = "DeployIQ backend — Docker monitoring, incident ingestion, AI investigation"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags FastAPI's standard `Depends(...)` parameter-default idiom.
ignore = ["B008"]

[tool.ruff.lint.isort]
# backend/alembic.ini makes ruff mistake the `alembic` package for first-party
# code on some machines; pin it (and the other third-party deps) explicitly so
# local and CI categorization always agree.
known-third-party = [
    "alembic",
    "docker",
    "fastapi",
    "httpx",
    "langgraph",
    "pydantic",
    "pydantic_settings",
    "pytest",
    "rank_bm25",
    "reportlab",
    "sqlalchemy",
]
