[project]
name = "deployiq-backend"
version = "0.1.0"
description = "DeployIQ backend — Docker monitoring, incident ingestion, AI investigation"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 flags FastAPI's standard `Depends(...)` parameter-default idiom.
ignore = ["B008"]
