name: deployiq-demo

# Shared health probe (all three demo apps expose /health on :8000).
x-healthcheck: &hc
  test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
  interval: 5s
  timeout: 3s
  retries: 2
  start_period: 10s

services:
  # Case 1 — ALL GOOD: clean container, stays RUNNING + healthy, boring logs.
  crashme-ok:
    build: ./crashme
    ports:
      - "18000:8000"
    healthcheck: *hc

  # Case 2 — APP ERROR: fires one ZeroDivisionError (~15s after boot, then
  # stays RUNNING). Re-trigger live any time: curl localhost:18001/boom
  # Watcher log-tailing auto-records the incident; Diagnose also works.
  crashme-boom:
    build: ./crashme
    ports:
      - "18001:8000"
    healthcheck: *hc
    command: ["sh", "-c", "python app.py & pid=$$!; sleep 15; python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/boom')\" 2>/dev/null; wait $$pid"]

  # Case 3 — HARD CRASH: calls /die ~45s after boot -> Exited(1).
  # The watcher records the exit-code incident on its own (no click needed).
  # Re-run the death live on demand: docker compose restart crashme-dead
  crashme-dead:
    build: ./crashme
    ports:
      - "18002:8000"
    healthcheck: *hc
    command: ["sh", "-c", "python app.py & pid=$$!; sleep 45; python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/die')\"; wait $$pid"]
